<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empleados - CONATEL</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: var(--bg-secondary);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
    
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">C</div>
      <div class="nav-title">
        <h1>CONATEL Panel</h1>
        <p>Sistema de Gestión de Tickets</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="tickets.html">Tickets</a>
      <a href="resolved.html">Resueltos</a>
      <a href="employees.html" class="active">Empleados</a>
      <a href="messages.html">Mensajes</a>
      <a href="settings.html" id="settingsLink">Config</a>
      <a href="users.html" id="usersLink">Usuarios</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="badge badge-info"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </nav>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2 style="font-size: 28px; font-weight: 600;">Empleados</h2>
      <button id="addBtn" class="btn btn-primary" onclick="openForm()">+ Nuevo Empleado</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Área</th>
            <th>Cargo</th>
            <th id="actionsHeader">Acciones</th>
          </tr>
        </thead>
        <tbody id="employeesTableBody">
          <tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal de Formulario -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 20px; font-weight: 600;">Nuevo Empleado</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted);">✕</button>
      </div>
      
      <div class="modal-body">
        <form id="employeeForm">
          <input type="hidden" id="editPhone" />
          
          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="fName" required />
          </div>
          
          <div class="form-group">
            <label>Teléfono (con código país)</label>
            <input type="text" id="fPhone" required placeholder="59170000000" />
          </div>
          
          <div class="form-group">
            <label>Área</label>
            <select id="fArea" required></select>
          </div>
          
          <div class="form-group">
            <label>Cargo</label>
            <input type="text" id="fRole" required />
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Guardar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let allAreas = [];

    // Verificar autenticación
    fetch('/api/auth/me')
      .then(res => {
        if (!res.ok) throw new Error('No autenticado');
        return res.json();
      })
      .then(user => {
        currentUser = user;
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent = user.role;
        
        if (user.role !== 'admin') {
          document.getElementById('settingsLink').style.display = 'none';
          document.getElementById('usersLink').style.display = 'none';
          document.getElementById('addBtn').style.display = 'none';
          document.getElementById('actionsHeader').style.display = 'none';
        }
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    // Tema
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    async function loadAreas() {
      const res = await fetch('/api/areas');
      allAreas = await res.json();
      const select = document.getElementById('fArea');
      select.innerHTML = allAreas.map(a => `<option value="${a}">${a}</option>`).join('');
    }

    async function load() {
      try {
        const res = await fetch('/api/employees');
        const employees = await res.json();

        const tbody = document.getElementById('employeesTableBody');
        if (employees.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">No hay empleados registrados</td></tr>`;
          return;
        }

        tbody.innerHTML = employees.map(e => {
          const actions = currentUser && currentUser.role === 'admin'
            ? `<td>
                <button class="btn btn-secondary" onclick='editEmployee(${JSON.stringify(e)})' style="padding: 6px 12px; font-size: 13px; margin-right: 8px;">Editar</button>
                <button class="btn btn-danger" onclick="deleteEmployee('${e.phone}')" style="padding: 6px 12px; font-size: 13px;">Eliminar</button>
              </td>`
            : '<td style="color: var(--text-muted);">-</td>';
          
          return `
            <tr>
              <td>${e.name}</td>
              <td style="font-family: monospace;">${e.phone}</td>
              <td>${e.area}</td>
              <td>${e.role}</td>
              ${actions}
            </tr>
          `;
        }).join('');
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function openForm() {
      if (!currentUser || currentUser.role !== 'admin') return;
      
      document.getElementById('modalTitle').textContent = 'Nuevo Empleado';
      document.getElementById('editPhone').value = '';
      document.getElementById('employeeForm').reset();
      document.getElementById('fPhone').disabled = false;
      document.getElementById('modal').classList.add('active');
    }

    function editEmployee(e) {
      if (!currentUser || currentUser.role !== 'admin') return;
      
      document.getElementById('modalTitle').textContent = 'Editar Empleado';
      document.getElementById('editPhone').value = e.phone;
      document.getElementById('fName').value = e.name;
      document.getElementById('fPhone').value = e.phone;
      document.getElementById('fPhone').disabled = true;
      document.getElementById('fArea').value = e.area;
      document.getElementById('fRole').value = e.role;
      document.getElementById('modal').classList.add('active');
    }

    async function deleteEmployee(phone) {
      if (!currentUser || currentUser.role !== 'admin') return;
      if (!confirm('¿Eliminar empleado?')) return;
      
      try {
        await fetch(`/api/employees/${phone}`, { method: 'DELETE' });
        load();
      } catch (error) {
        alert('Error al eliminar');
      }
    }

    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editPhone = document.getElementById('editPhone').value;
      const data = {
        name: document.getElementById('fName').value,
        phone: document.getElementById('fPhone').value,
        area: document.getElementById('fArea').value,
        role: document.getElementById('fRole').value
      };

      try {
        if (editPhone) {
          await fetch(`/api/employees/${editPhone}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } else {
          await fetch('/api/employees', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        }

        closeModal();
        load();
      } catch (error) {
        alert('Error al guardar');
      }
    });

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    loadAreas();
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
