<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - CONATEL</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">C</div>
      <div class="nav-title">
        <h1>CONATEL Panel</h1>
        <p>Sistema de Gestión de Tickets</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">Dashboard</a>
      <a href="tickets.html">Tickets</a>
      <a href="resolved.html">Resueltos</a>
      <a href="employees.html">Empleados</a>
      <a href="messages.html">Mensajes</a>
      <a href="settings.html" id="settingsLink">Config</a>
      <a href="users.html" id="usersLink">Usuarios</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="badge badge-info"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </nav>

  <main>
    <h2 style="font-size: 28px; font-weight: 600; margin-bottom: 24px;">Dashboard</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px;">
      <div class="card">
        <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Total Tickets</div>
        <div style="font-size: 36px; font-weight: 700;" id="totalTickets">0</div>
      </div>
      <div class="card">
        <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Tickets Abiertos</div>
        <div style="font-size: 36px; font-weight: 700; color: var(--accent);" id="openTickets">0</div>
      </div>
      <div class="card">
        <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Tickets Resueltos</div>
        <div style="font-size: 36px; font-weight: 700; color: var(--success);" id="closedTickets">0</div>
      </div>
      <div class="card">
        <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">Empleados</div>
        <div style="font-size: 36px; font-weight: 700; color: var(--warning);" id="totalEmployees">0</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px;">
      <div class="card">
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px;">Tickets por Área</h3>
        <div id="byArea"></div>
      </div>
      <div class="card">
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px;">Tickets por Prioridad</h3>
        <div id="byPriority"></div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 20px;">Top 5 Tickets Prioritarios</h3>
      <div id="topTickets"></div>
    </div>
  </main>

  <script>
    // Verificar autenticación
    fetch('/api/auth/me')
      .then(res => {
        if (!res.ok) throw new Error('No autenticado');
        return res.json();
      })
      .then(user => {
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent = user.role;
        
        // Ocultar links según rol
        if (user.role !== 'admin') {
          document.getElementById('settingsLink').style.display = 'none';
          document.getElementById('usersLink').style.display = 'none';
        }
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    // Tema
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    // Logout
    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    // Cargar datos
    const priorityColors = {
      critica: 'badge-error',
      alta: 'badge-warning',
      media: 'badge-info',
      baja: 'badge-success'
    };

    async function load() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();

        document.getElementById('totalTickets').textContent = data.total;
        document.getElementById('openTickets').textContent = data.open;
        document.getElementById('closedTickets').textContent = data.closed;
        document.getElementById('totalEmployees').textContent = data.employees;

        // Tickets por área
        const areaEntries = Object.entries(data.byArea).filter(([_, count]) => count > 0);
        const areaTotal = areaEntries.reduce((a, [_, c]) => a + c, 0) || 1;
        
        document.getElementById('byArea').innerHTML = areaEntries.length
          ? areaEntries.map(([area, count]) => {
              const pct = (count / areaTotal) * 100;
              return `
                <div style="margin-bottom: 16px;">
                  <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px;">
                    <span>${area}</span>
                    <span style="color: var(--text-muted);">${count}</span>
                  </div>
                  <div style="height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                    <div style="height: 100%; width: ${pct}%; background: var(--accent); transition: width 0.3s;"></div>
                  </div>
                </div>
              `;
            }).join('')
          : '<p style="color: var(--text-muted);">Sin tickets aún</p>';

        // Tickets por prioridad
        const prioTotal = Object.values(data.byPriority).reduce((a, b) => a + b, 0) || 1;
        document.getElementById('byPriority').innerHTML = Object.entries(data.byPriority)
          .map(([prio, count]) => {
            const pct = (count / prioTotal) * 100;
            return `
              <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px;">
                  <span style="text-transform: capitalize;">${prio}</span>
                  <span style="color: var(--text-muted);">${count}</span>
                </div>
                <div style="height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                  <div style="height: 100%; width: ${pct}%; background: var(--${prio === 'critica' ? 'error' : prio === 'alta' ? 'warning' : prio === 'media' ? 'accent' : 'success'}); transition: width 0.3s;"></div>
                </div>
              </div>
            `;
          })
          .join('');

        // Top tickets
        document.getElementById('topTickets').innerHTML = data.topTickets.length
          ? `<table>
              <thead>
                <tr>
                  <th>Ticket</th>
                  <th>Título</th>
                  <th>Área</th>
                  <th>Prioridad</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody>
                ${data.topTickets.map(t => `
                  <tr>
                    <td style="font-family: monospace; color: var(--accent);">#T-${t.id}</td>
                    <td>${t.title}</td>
                    <td>${t.area}</td>
                    <td><span class="badge ${priorityColors[t.priority]}">${t.priority}</span></td>
                    <td>${t.score}/100</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
          : '<p style="color: var(--text-muted);">No hay tickets abiertos</p>';
      } catch (error) {
        console.error('Error cargando datos:', error);
      }
    }

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
