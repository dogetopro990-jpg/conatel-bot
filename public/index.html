<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - CONATEL</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      <div class="nav-logo">C</div>
      <div class="nav-title">
        <h1>CONATEL</h1>
        <p>Sistema de Tickets</p>
      </div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="/index.html" class="active">Dashboard</a>
      <a href="/tickets.html">Tickets</a>
      <a href="/resolved.html">Resueltos</a>
      <a href="/employees.html">Empleados</a>
      <a href="/messages.html">Mensajes</a>
      <a href="/whatsapp.html">WhatsApp</a>
      <a href="/connection.html">Conexión</a>
      <a href="/database.html" id="dbLink">Base de datos</a>
      <a href="/settings.html" id="settingsLink">Config</a>
      <a href="/users.html" id="usersLink">Usuarios</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="badge badge-primary"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </nav>

  <main>
    <div class="flex items-center justify-between mb-3 flex-col" style="align-items: flex-start;">
      <h2 style="font-size: 28px; font-weight: 700;">Dashboard</h2>
      <p class="text-muted" id="lastUpdate">Actualizando...</p>
    </div>

    <!-- Estadísticas principales -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="loading"><div class="spinner"></div></div></div>
    </div>

    <!-- Tickets prioritarios -->
    <div class="card">
      <div class="flex items-center justify-between mb-2">
        <h3>🔥 Tickets Prioritarios</h3>
        <a href="/tickets.html" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px;">Ver todos →</a>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Área</th>
              <th>Prioridad</th>
              <th>Solicitante</th>
            </tr>
          </thead>
          <tbody id="topTickets">
            <tr><td colspan="5" class="loading"><div class="spinner"></div> Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Distribución por área -->
    <div class="grid-2">
      <div class="card">
        <h3>📊 Por Área</h3>
        <div id="byArea"></div>
      </div>
      <div class="card">
        <h3>🎯 Por Prioridad</h3>
        <div id="byPriority"></div>
      </div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let statsCache = null;
    let cacheTime = 0;
    const CACHE_DURATION = 10000; // 10 segundos

    // Auth
    fetch('/api/auth/me')
      .then(res => {
        if (!res.ok) throw new Error('No autenticado');
        return res.json();
      })
      .then(user => {
        currentUser = user;
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent = user.role;
        if (user.role !== 'admin') {
          ['settingsLink', 'usersLink', 'dbLink'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
          });
        }
        loadDashboard();
      })
      .catch(() => { window.location.href = '/login.html'; });

    // Tema
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    // Carga optimizada con caché
    async function loadDashboard() {
      const now = Date.now();
      
      // Usar caché si es reciente
      if (statsCache && (now - cacheTime) < CACHE_DURATION) {
        renderDashboard(statsCache);
        return;
      }

      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        statsCache = data;
        cacheTime = now;
        renderDashboard(data);
        document.getElementById('lastUpdate').textContent = 
          `Actualizado: ${new Date().toLocaleTimeString('es')}`;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function renderDashboard(data) {
      // Stats principales
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Tickets Abiertos</div>
          <div class="stat-value text-primary">${data.open}</div>
          <div class="stat-sub">de ${data.total} totales</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Resueltos</div>
          <div class="stat-value text-success">${data.closed}</div>
          <div class="stat-sub">completados</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Empleados</div>
          <div class="stat-value">${data.employees}</div>
          <div class="stat-sub">registrados</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Críticos</div>
          <div class="stat-value text-error">${data.byPriority.critica || 0}</div>
          <div class="stat-sub">requieren atención</div>
        </div>
      `;

      // Top tickets
      const topTbody = document.getElementById('topTickets');
      if (data.topTickets.length === 0) {
        topTbody.innerHTML = '<tr><td colspan="5" class="empty-state">No hay tickets prioritarios 🎉</td></tr>';
      } else {
        const priorityColors = {
          critica: 'badge-error',
          alta: 'badge-warning',
          media: 'badge-info',
          baja: 'badge-success'
        };
        topTbody.innerHTML = data.topTickets.map(t => `
          <tr>
            <td><strong class="text-primary">${t.ticketId || `T-${t.id}`}</strong></td>
            <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${t.title}</td>
            <td>${t.area}</td>
            <td><span class="badge ${priorityColors[t.priority] || 'badge-info'}">${t.priority} (${t.score})</span></td>
            <td>${t.requesterName}</td>
          </tr>
        `).join('');
      }

      // Por área
      const byArea = document.getElementById('byArea');
      const areaEntries = Object.entries(data.byArea).filter(([_, v]) => v > 0).sort((a, b) => b[1] - a[1]);
      if (areaEntries.length === 0) {
        byArea.innerHTML = '<p class="text-muted">Sin datos</p>';
      } else {
        const maxArea = Math.max(...areaEntries.map(([_, v]) => v));
        byArea.innerHTML = areaEntries.map(([area, count]) => `
          <div style="margin-bottom: 12px;">
            <div class="flex justify-between mb-1" style="font-size: 13px;">
              <span>${area}</span>
              <strong>${count}</strong>
            </div>
            <div style="background: var(--bg-tertiary); height: 8px; border-radius: 4px; overflow: hidden;">
              <div style="background: var(--primary); height: 100%; width: ${(count / maxArea) * 100}%; transition: width 0.3s;"></div>
            </div>
          </div>
        `).join('');
      }

      // Por prioridad
      const byPriority = document.getElementById('byPriority');
      const priorityColors = {
        critica: 'var(--error)',
        alta: 'var(--warning)',
        media: 'var(--info)',
        baja: 'var(--success)'
      };
      const priorityEntries = Object.entries(data.byPriority);
      const maxPriority = Math.max(...priorityEntries.map(([_, v]) => v), 1);
      byPriority.innerHTML = priorityEntries.map(([priority, count]) => `
        <div style="margin-bottom: 12px;">
          <div class="flex justify-between mb-1" style="font-size: 13px;">
            <span>${priority}</span>
            <strong>${count}</strong>
          </div>
          <div style="background: var(--bg-tertiary); height: 8px; border-radius: 4px; overflow: hidden;">
            <div style="background: ${priorityColors[priority]}; height: 100%; width: ${(count / maxPriority) * 100}%; transition: width 0.3s;"></div>
          </div>
        </div>
      `).join('');
    }

    // Auto-refresh cada 30 segundos
    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
