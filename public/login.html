<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - CONATEL</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body class="login-container">
  <div class="login-card">
    <div class="login-logo">C</div>
    <h1 class="login-title">CONATEL</h1>
    <p class="login-subtitle">Sistema de Gestión de Tickets</p>

    <div class="login-tabs">
      <div class="login-tab active" onclick="switchTab('login')">Iniciar Sesión</div>
      <div class="login-tab" onclick="switchTab('register')">Registrarse</div>
    </div>

    <div id="loginForm">
      <div class="mb-2">
        <label>Usuario</label>
        <input type="text" id="loginUsername" placeholder="admin" autocomplete="username" />
      </div>
      <div class="mb-2">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Ingresar</button>
    </div>

    <div id="registerForm" style="display: none;">
      <div class="mb-2">
        <label>Nombre completo</label>
        <input type="text" id="regName" placeholder="Juan Pérez" />
      </div>
      <div class="mb-2">
        <label>Usuario</label>
        <input type="text" id="regUsername" placeholder="juanperez" />
      </div>
      <div class="mb-2">
        <label>Contraseña (mín. 6 caracteres)</label>
        <input type="password" id="regPassword" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>
    </div>

    <div id="message" style="margin-top: 16px; text-align: center; font-size: 14px;"></div>

    <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
      <button class="theme-toggle" onclick="toggleTheme()" style="margin: 0 auto;">🌓 Cambiar tema</button>
    </div>
  </div>

  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function switchTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('message').innerHTML = '';
    }

    function showMessage(text, isError = false) {
      document.getElementById('message').innerHTML = 
        `<div class="alert alert-${isError ? 'error' : 'success'}">${text}</div>`;
    }

    async function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      if (!username || !password) {
        showMessage('Completa todos los campos', true);
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          showMessage('✓ Ingresando...');
          setTimeout(() => window.location.href = '/index.html', 500);
        } else {
          showMessage(data.error || 'Credenciales inválidas', true);
        }
      } catch (error) {
        showMessage('Error de conexión', true);
      }
    }

    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      
      if (!name || !username || !password) {
        showMessage('Completa todos los campos', true);
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          showMessage('✓ Cuenta creada. Ya puedes iniciar sesión.');
          setTimeout(() => {
            document.querySelector('.login-tab').click();
          }, 1500);
        } else {
          showMessage(data.error || 'Error al crear cuenta', true);
        }
      } catch (error) {
        showMessage('Error de conexión', true);
      }
    }

    // Enter para enviar
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('regPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
