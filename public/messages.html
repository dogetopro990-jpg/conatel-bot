<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensajes - CONATEL</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    .chat-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      height: calc(100vh - 200px);
    }
    
    .contacts-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .contacts-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
    }
    
    .contacts-list {
      flex: 1;
      overflow-y: auto;
    }
    
    .contact-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .contact-item:hover {
      background: var(--bg-hover);
    }
    
    .contact-item.active {
      background: var(--bg-hover);
      border-left: 3px solid var(--accent);
    }
    
    .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
    }
    
    .contact-info {
      flex: 1;
      min-width: 0;
    }
    
    .contact-name {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 2px;
    }
    
    .contact-area {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .chat-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg-primary);
    }
    
    .message {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    
    .message.sent {
      align-items: flex-end;
    }
    
    .message.received {
      align-items: flex-start;
    }
    
    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    
    .message.sent .message-bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message.received .message-bubble {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    
    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }
    
    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      gap: 12px;
    }
    
    .chat-input-area input {
      flex: 1;
    }
    
    .no-chat-selected {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 16px;
    }
    
    .broadcast-section {
      margin-top: 20px;
    }
    
    @media (max-width: 768px) {
      .chat-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      
      .contacts-panel {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">C</div>
      <div class="nav-title">
        <h1>CONATEL Panel</h1>
        <p>Sistema de Gestión de Tickets</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="tickets.html">Tickets</a>
      <a href="resolved.html">Resueltos</a>
      <a href="employees.html">Empleados</a>
      <a href="messages.html" class="active">Mensajes</a>
      <a href="settings.html" id="settingsLink">Config</a>
      <a href="users.html" id="usersLink">Usuarios</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
      <div class="user-info">
        <span id="userName">Usuario</span>
        <span id="userRole" class="badge badge-info"></span>
      </div>
      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </nav>

  <main>
    <h2 style="font-size: 28px; font-weight: 600; margin-bottom: 24px;">Mensajería</h2>
    
    <div class="chat-layout">
      <!-- Panel de Contactos -->
      <div class="contacts-panel">
        <div class="contacts-header">
          <input type="text" id="searchContact" placeholder="Buscar empleado..." style="width: 100%;" />
        </div>
        <div class="contacts-list" id="contactsList">
          <p style="text-align: center; padding: 40px; color: var(--text-muted);">Cargando empleados...</p>
        </div>
      </div>

      <!-- Panel de Chat -->
      <div class="chat-panel" id="chatPanel">
        <div class="no-chat-selected" id="noChatSelected">
          Selecciona un empleado para iniciar una conversación
        </div>
        
        <div id="chatContent" style="display: none; flex-direction: column; height: 100%;">
          <div class="chat-header">
            <div class="contact-avatar" id="chatAvatar">?</div>
            <div>
              <div style="font-weight: 600;" id="chatName">Empleado</div>
              <div style="font-size: 12px; color: var(--text-muted);" id="chatArea">Área</div>
            </div>
          </div>
          
          <div class="chat-messages" id="chatMessages">
            <p style="text-align: center; color: var(--text-muted); padding: 40px;">No hay mensajes aún</p>
          </div>
          
          <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')sendMessage()" />
            <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de Broadcast -->
    <div class="broadcast-section card" id="broadcastSection" style="margin-top: 24px;">
      <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">📢 Mensaje Masivo</h3>
      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 12px;">
        <select id="broadcastArea">
          <option value="">Todos los empleados</option>
        </select>
        <input type="text" id="broadcastMessage" placeholder="Escribe tu mensaje masivo..." />
      </div>
      <button class="btn btn-primary" onclick="sendBroadcast()">Enviar a Todos</button>
      <div id="broadcastResult" style="margin-top: 12px; font-size: 14px;"></div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let allEmployees = [];
    let allAreas = [];
    let selectedEmployee = null;
    let messageHistory = {};

    // Verificar autenticación
    fetch('/api/auth/me')
      .then(res => {
        if (!res.ok) throw new Error('No autenticado');
        return res.json();
      })
      .then(user => {
        currentUser = user;
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent = user.role;
        
        if (user.role !== 'admin') {
          document.getElementById('settingsLink').style.display = 'none';
          document.getElementById('usersLink').style.display = 'none';
          document.getElementById('broadcastSection').style.display = 'none';
        }
        
        loadEmployees();
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    // Tema
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    async function loadEmployees() {
      try {
        const [empRes, areasRes] = await Promise.all([
          fetch('/api/employees'),
          fetch('/api/areas')
        ]);
        
        allEmployees = await empRes.json();
        allAreas = await areasRes.json();

        renderContacts();
        
        // Actualizar dropdown de broadcast
        const broadcastArea = document.getElementById('broadcastArea');
        broadcastArea.innerHTML = '<option value="">Todos los empleados</option>' + 
          allAreas.map(a => `<option value="${a}">${a}</option>`).join('');
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function renderContacts(filter = '') {
      const filtered = allEmployees.filter(e => 
        e.name.toLowerCase().includes(filter.toLowerCase()) ||
        e.area.toLowerCase().includes(filter.toLowerCase())
      );

      const contactsList = document.getElementById('contactsList');
      
      if (filtered.length === 0) {
        contactsList.innerHTML = '<p style="text-align: center; padding: 40px; color: var(--text-muted);">No se encontraron empleados</p>';
        return;
      }

      contactsList.innerHTML = filtered.map(e => {
        const initial = e.name.charAt(0).toUpperCase();
        const isActive = selectedEmployee && selectedEmployee.phone === e.phone;
        
        return `
          <div class="contact-item ${isActive ? 'active' : ''}" onclick="selectEmployee('${e.phone}')">
            <div class="contact-avatar">${initial}</div>
            <div class="contact-info">
              <div class="contact-name">${e.name}</div>
              <div class="contact-area">${e.area} • ${e.role}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectEmployee(phone) {
      selectedEmployee = allEmployees.find(e => e.phone === phone);
      if (!selectedEmployee) return;

      document.getElementById('noChatSelected').style.display = 'none';
      document.getElementById('chatContent').style.display = 'flex';

      const initial = selectedEmployee.name.charAt(0).toUpperCase();
      document.getElementById('chatAvatar').textContent = initial;
      document.getElementById('chatName').textContent = selectedEmployee.name;
      document.getElementById('chatArea').textContent = `${selectedEmployee.area} • ${selectedEmployee.phone}`;

      renderContacts(document.getElementById('searchContact').value);
      loadMessages();
    }

    function loadMessages() {
      if (!selectedEmployee) return;

      const messages = messageHistory[selectedEmployee.phone] || [];
      const chatMessages = document.getElementById('chatMessages');

      if (messages.length === 0) {
        chatMessages.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">Inicia una conversación</p>';
        return;
      }

      chatMessages.innerHTML = messages.map(m => {
        const type = m.from === 'panel' ? 'sent' : 'received';
        const time = new Date(m.at).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="message ${type}">
            <div class="message-bubble">${m.text}</div>
            <div class="message-time">${time}</div>
          </div>
        `;
      }).join('');

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      if (!selectedEmployee) return;

      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        const res = await fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to: selectedEmployee.phone,
            text
          })
        });

        const data = await res.json();

        if (data.ok) {
          // Agregar mensaje al historial local
          if (!messageHistory[selectedEmployee.phone]) {
            messageHistory[selectedEmployee.phone] = [];
          }
          
          messageHistory[selectedEmployee.phone].push({
            from: 'panel',
            text,
            at: new Date().toISOString()
          });

          input.value = '';
          loadMessages();
        } else {
          alert('Error al enviar mensaje: ' + (data.error || 'Desconocido'));
        }
      } catch (error) {
        alert('Error de red al enviar mensaje');
      }
    }

    async function sendBroadcast() {
      if (!currentUser || currentUser.role !== 'admin') return;

      const area = document.getElementById('broadcastArea').value;
      const text = document.getElementById('broadcastMessage').value.trim();
      
      if (!text) {
        alert('Escribe un mensaje');
        return;
      }

      if (!confirm(`¿Enviar mensaje a ${area || 'todos los empleados'}?`)) return;

      try {
        const res = await fetch('/api/messages/broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ area: area || undefined, text })
        });

        const data = await res.json();
        const resultEl = document.getElementById('broadcastResult');
        
        if (data.ok) {
          resultEl.innerHTML = `<span style="color: var(--success);">✓ Mensaje enviado a ${data.sent}/${data.total} empleados</span>`;
          document.getElementById('broadcastMessage').value = '';
        } else {
          resultEl.innerHTML = `<span style="color: var(--error);">✗ Error: ${data.error}</span>`;
        }
      } catch (error) {
        document.getElementById('broadcastResult').innerHTML = `<span style="color: var(--error);">✗ Error de red</span>`;
      }
    }

    document.getElementById('searchContact').addEventListener('input', (e) => {
      renderContacts(e.target.value);
    });

    // Auto-refresh cada 10 segundos
    setInterval(() => {
      if (selectedEmployee) {
        loadMessages();
      }
    }, 10000);
  </script>
</body>
</html>
