<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Configuración - CONATEL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold">C</div>
      <h1 class="text-lg font-bold">CONATEL Panel</h1>
    </div>
    <div class="flex gap-2 text-sm">
      <a href="index.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Dashboard</a>
      <a href="tickets.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Tickets</a>
      <a href="employees.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Empleados</a>
      <a href="messages.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Mensajes</a>
      <a href="settings.html" class="px-3 py-1.5 bg-blue-600 rounded">Config</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-6">
    <h2 class="text-2xl font-bold mb-6">Configuración</h2>

    <div class="bg-slate-800 rounded-lg p-6 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-bold">Alertas automáticas</div>
          <div class="text-sm text-slate-400">Enviar avisos según prioridad</div>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="autoAlerts" class="sr-only peer" />
          <div class="w-11 h-6 bg-slate-600 peer-checked:bg-blue-600 rounded-full peer relative transition">
            <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition peer-checked:translate-x-5"></div>
          </div>
        </label>
      </div>

      <div>
        <label class="font-bold">Umbral de prioridad</label>
        <div class="text-sm text-slate-400 mb-2">Score mínimo para alertar (0-100)</div>
        <input type="number" id="threshold" min="0" max="100" class="w-full bg-slate-700 px-3 py-2 rounded" />
      </div>

      <div>
        <div class="font-bold mb-2">Notificaciones por área</div>
        <div class="space-y-2">
          <div class="flex items-center justify-between bg-slate-900 p-3 rounded">
            <span class="capitalize">Soporte</span>
            <input type="checkbox" id="area_soporte" class="w-5 h-5" />
          </div>
          <div class="flex items-center justify-between bg-slate-900 p-3 rounded">
            <span class="capitalize">Infraestructura</span>
            <input type="checkbox" id="area_infraestructura" class="w-5 h-5" />
          </div>
          <div class="flex items-center justify-between bg-slate-900 p-3 rounded">
            <span class="capitalize">Desarrollo</span>
            <input type="checkbox" id="area_desarrollo" class="w-5 h-5" />
          </div>
        </div>
      </div>

      <button onclick="save()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">Guardar cambios</button>
      <div id="result" class="text-sm text-center"></div>
    </div>
  </main>

  <script>
    async function load() {
      const res = await fetch('/api/settings');
      const s = await res.json();

      document.getElementById('autoAlerts').checked = s.autoAlerts;
      document.getElementById('threshold').value = s.priorityThreshold;
      document.getElementById('area_soporte').checked = s.areaNotifications.soporte;
      document.getElementById('area_infraestructura').checked = s.areaNotifications.infraestructura;
      document.getElementById('area_desarrollo').checked = s.areaNotifications.desarrollo;
    }

    async function save() {
      const data = {
        autoAlerts: document.getElementById('autoAlerts').checked,
        priorityThreshold: Number(document.getElementById('threshold').value),
        areaNotifications: {
          soporte: document.getElementById('area_soporte').checked,
          infraestructura: document.getElementById('area_infraestructura').checked,
          desarrollo: document.getElementById('area_desarrollo').checked
        }
      };

      await fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      document.getElementById('result').innerHTML = '<span class="text-green-400">✓ Guardado</span>';
      setTimeout(() => (document.getElementById('result').innerHTML = ''), 2000);
    }

    load();
  </script>
</body>
</html>
