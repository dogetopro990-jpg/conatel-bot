<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración - CONATEL</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold">C</div>
      <h1 class="text-lg font-bold">CONATEL Panel</h1>
    </div>
    <div class="flex gap-2 text-sm flex-wrap">
      <a href="/" class="px-3 py-1.5 hover:bg-slate-700 rounded">Dashboard</a>
      <a href="/tickets.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Tickets</a>
      <a href="/resolved.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">✅ Resueltos</a>
      <a href="/employees.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Empleados</a>
      <a href="/messages.html" class="px-3 py-1.5 hover:bg-slate-700 rounded">Mensajes</a>
      <a href="/settings.html" class="px-3 py-1.5 bg-blue-600 rounded">Config</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <h2 class="text-2xl font-bold">Configuración del Bot</h2>

    <!-- General -->
    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700">
      <h3 class="font-bold text-lg mb-4">⚙️ General</h3>
      <div class="space-y-4">
        <div>
          <label class="text-sm text-slate-400">Nombre del bot</label>
          <input type="text" id="botName" class="w-full bg-slate-700 px-3 py-2 rounded mt-1" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm text-slate-400">Delay mínimo (ms)</label>
            <input type="number" id="minDelay" class="w-full bg-slate-700 px-3 py-2 rounded mt-1" />
          </div>
          <div>
            <label class="text-sm text-slate-400">Delay máximo (ms)</label>
            <input type="number" id="maxDelay" class="w-full bg-slate-700 px-3 py-2 rounded mt-1" />
          </div>
        </div>
        <div>
          <label class="text-sm text-slate-400">Umbral de prioridad (0-100)</label>
          <input type="number" id="threshold" min="0" max="100" class="w-full bg-slate-700 px-3 py-2 rounded mt-1" />
        </div>
        <div class="flex items-center justify-between">
          <div>
            <div class="font-bold">Alertas automáticas</div>
            <div class="text-sm text-slate-400">Enviar avisos según prioridad</div>
          </div>
          <input type="checkbox" id="autoAlerts" class="w-5 h-5" />
        </div>
        <button onclick="saveGeneral()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">💾 Guardar General</button>
      </div>
    </div>

    <!-- Áreas -->
    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700">
      <h3 class="font-bold text-lg mb-4">🏢 Áreas de la Empresa</h3>
      <div id="areasList" class="space-y-2 mb-4"></div>
      <div class="flex gap-2">
        <input type="text" id="newArea" placeholder="Nueva área..." class="flex-1 bg-slate-700 px-3 py-2 rounded" />
        <button onclick="addArea()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold">+ Agregar</button>
      </div>
    </div>

    <!-- Mensajes -->
    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700">
      <h3 class="font-bold text-lg mb-4">💬 Mensajes Automáticos</h3>
      <p class="text-sm text-slate-400 mb-4">Personaliza las respuestas del bot. Agrega múltiples opciones separadas por línea.</p>
      
      <div class="space-y-4">
        <div>
          <label class="text-sm text-slate-400 font-semibold">Saludo (usuarios no registrados)</label>
          <textarea id="msg_saludo" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="text-sm text-slate-400 font-semibold">Saludo (usuarios registrados) - usa {nombre}</label>
          <textarea id="msg_saludo_registrado" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="text-sm text-slate-400 font-semibold">Transición después del registro - usa {nombre}</label>
          <textarea id="msg_transicion_a_solicitud" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="text-sm text-slate-400 font-semibold">Problema detectado</label>
          <textarea id="msg_problema_detectado" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="text-sm text-slate-400 font-semibold">Agradecimiento</label>
          <textarea id="msg_agradecimiento" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <div>
          <label class="text-sm text-slate-400 font-semibold">Despedida</label>
          <textarea id="msg_despedida" rows="3" class="w-full bg-slate-700 px-3 py-2 rounded mt-1 font-mono text-sm"></textarea>
        </div>
        <button onclick="saveMessages()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">💾 Guardar Mensajes</button>
      </div>
    </div>

    <div id="result" class="text-center text-sm"></div>
  </main>

  <script>
    async function loadGeneral() {
      const res = await fetch('/api/config/general');
      const data = await res.json();
      document.getElementById('botName').value = data.botName || '';
      document.getElementById('minDelay').value = data.minDelayMs || 300;
      document.getElementById('maxDelay').value = data.maxDelayMs || 800;
      document.getElementById('threshold').value = data.priorityThreshold || 70;
      document.getElementById('autoAlerts').checked = data.autoAlerts !== false;
    }

    async function saveGeneral() {
      const data = {
        botName: document.getElementById('botName').value,
        minDelayMs: Number(document.getElementById('minDelay').value),
        maxDelayMs: Number(document.getElementById('maxDelay').value),
        priorityThreshold: Number(document.getElementById('threshold').value),
        autoAlerts: document.getElementById('autoAlerts').checked
      };

      await fetch('/api/config/general', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      showResult('✓ Configuración general guardada');
    }

    async function loadAreas() {
      const res = await fetch('/api/areas');
      const areas = await res.json();
      document.getElementById('areasList').innerHTML = areas.map(a => `
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded border border-slate-700">
          <span>${a}</span>
          <button onclick="deleteArea('${a.replace(/'/g, "\\'")}')" class="text-red-400 hover:text-red-300 text-sm">Eliminar</button>
        </div>
      `).join('');
    }

    async function addArea() {
      const area = document.getElementById('newArea').value.trim();
      if (!area) return;

      await fetch('/api/areas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ area })
      });

      document.getElementById('newArea').value = '';
      loadAreas();
      showResult('✓ Área agregada');
    }

    async function deleteArea(area) {
      if (!confirm(`¿Eliminar área "${area}"?`)) return;

      await fetch('/api/areas', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ area })
      });

      loadAreas();
      showResult('✓ Área eliminada');
    }

    async function loadMessages() {
      const res = await fetch('/api/config/messages');
      const messages = await res.json();
      
      const categories = ['saludo', 'saludo_registrado', 'transicion_a_solicitud', 'problema_detectado', 'agradecimiento', 'despedida'];
      categories.forEach(cat => {
        const textarea = document.getElementById(`msg_${cat}`);
        if (textarea && messages[cat]) {
          textarea.value = messages[cat].join('\n');
        }
      });
    }

    async function saveMessages() {
      const categories = ['saludo', 'saludo_registrado', 'transicion_a_solicitud', 'problema_detectado', 'agradecimiento', 'despedida'];
      const messages = {};
      
      categories.forEach(cat => {
        const textarea = document.getElementById(`msg_${cat}`);
        if (textarea) {
          const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l);
          if (lines.length > 0) {
            messages[cat] = lines;
          }
        }
      });

      await fetch('/api/config/messages', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(messages)
      });

      showResult('✓ Mensajes guardados');
    }

    function showResult(msg) {
      const el = document.getElementById('result');
      el.innerHTML = `<span class="text-green-400">${msg}</span>`;
      setTimeout(() => el.innerHTML = '', 3000);
    }

    loadGeneral();
    loadAreas();
    loadMessages();
  </script>
</body>
</html>
